[tools]
shellcheck = "0.10.0"
actionlint = "1.7.7"

[tasks.check]
description = "Validate shell and GitHub Actions workflows"
run = ["bash -n t3code/verify.sh", "sh -n t3code/entrypoint.sh", "shellcheck t3code/*.sh", "actionlint"]

[tasks."t3code:build"]
description = "Build T3 locally for verification only; never publish"
run = "docker build --platform linux/amd64 -t t3code-verify:local t3code"

[tasks."t3code:verify"]
description = "Verify tools, restricted startup, pairing-code generation and persistence without credentials"
run = "bash t3code/verify.sh t3code-verify:local"

[tasks."t3code:scan"]
description = "Scan the local software image; block fixable high/critical CVEs"
run = "bash t3code/scan.sh docker:t3code-verify:local /tmp/t3code-scan.json"
