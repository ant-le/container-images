name: Build, test and publish container

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image:
        required: true
        type: string
      smoke-script:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    outputs:
      digest:
        description: Published image digest (empty for verification-only runs)
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.9
      - run: mise run check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ inputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.context }}
          cache-to: type=gha,mode=max,scope=${{ inputs.context }}
      - name: Smoke-test the exact image to be published
        env:
          IMAGE: ${{ inputs.image }}:${{ github.sha }}
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
        run: bash "$SMOKE_SCRIPT" "$IMAGE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the smoke-tested image without rebuilding
        id: publish
        if: inputs.publish
        env:
          IMAGE: ${{ inputs.image }}:${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE"
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          digest=${reference##*@}
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not determine published digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Published image'
            echo "\`$reference\`"
            echo "Source commit: \`$SOURCE_SHA\`"
            echo 'Publishing does not deploy this image. Open a deployment PR from the server checkout:'
            if [[ "$IMAGE" == ghcr.io/ant-le/openclaw:* ]]; then
              echo "\`mise run openclaw:release -- $digest $SOURCE_SHA\`"
            else
              echo 'Select this digest in the corresponding server configuration and review the deployment PR.'
            fi
            echo 'First publication: make the software-only GHCR package public before proposing deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
