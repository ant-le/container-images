name: OpenClaw image

on:
  push:
    branches: [main]
    paths:
      - openclaw/**
      - .github/workflows/**
      - mise.toml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      context: openclaw
      image: ghcr.io/ant-le/openclaw
      smoke-script: openclaw/verify.sh
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
